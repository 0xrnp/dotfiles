services:
  influxdb:
    image: influxdb:3-core
    restart: unless-stopped
    ports:
      - "127.0.0.1:8181:8181"
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
    volumes:
      - influxdb_data:/var/lib/influxdb3/data

  explorer:
    image: influxdata/influxdb3-ui:1.9.0
    command: ["--mode=admin"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"

volumes:
  influxdb_data:
